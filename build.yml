name: Build KaraokeAI Studio EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Installa dipendenze (CPU Optimized)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install customtkinter openai-whisper pillow numpy pyinstaller tiktoken

      - name: Scarica FFmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath temp_ffmpeg
          $f = Get-ChildItem -Path "temp_ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $p = Get-ChildItem -Path "temp_ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $f.FullName -Destination "ffmpeg.exe"
          Copy-Item $p.FullName -Destination "ffprobe.exe"

      - name: Pre-scarica modello Whisper
        run: |
          python -c "import whisper; whisper.load_model('tiny', download_root='whisper_models')"

      - name: Compila EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm --onefile --windowed `
            --name "KaraokeAI_Studio" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-data "whisper_models;whisper_models" `
            --collect-all whisper `
            --collect-all customtkinter `
            --hidden-import "tiktoken_ext.openai_public" `
            --hidden-import "tiktoken_ext" `
            --exclude-module "matplotlib" `
            --exclude-module "scipy" `
            main.py

      - name: Carica EXE
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeAI_Studio_Windows
          path: dist/KaraokeAI_Studio.exe
