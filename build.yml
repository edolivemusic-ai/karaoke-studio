name: Build KaraokeAI Studio EXE

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Installa Dipendenze
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install customtkinter openai-whisper pillow numpy pyinstaller tiktoken

      - name: Scarica FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath tmp
          $f = Get-ChildItem -Path "tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $f.FullName -Destination "ffmpeg.exe"

      - name: Compilazione EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "KaraokeAI_Studio_Pro" `
            --add-binary "ffmpeg.exe;." `
            --collect-all whisper `
            --collect-all customtkinter `
            --hidden-import "tiktoken_ext.openai_public" `
            --hidden-import "tiktoken_ext" `
            main.py

      - name: Upload Risultato
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeAI_Studio_Windows
          path: dist/KaraokeAI_Studio_Pro.exe
