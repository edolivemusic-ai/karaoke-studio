name: Build KaraokeAI Studio PRO

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install customtkinter openai-whisper pyinstaller pillow numpy tiktoken

      - name: Fetch FFmpeg Binaries
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath temp
          $bin = Get-ChildItem -Path "temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $bin.FullName -Destination "ffmpeg.exe"
          $prob = Get-ChildItem -Path "temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $prob.FullName -Destination "ffprobe.exe"

      - name: PyInstaller Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "KaraokeAI_Studio_Pro" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --collect-all whisper `
            --collect-all customtkinter `
            --hidden-import "tiktoken_ext.openai_public" `
            main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows_Executable
          path: dist/KaraokeAI_Studio_Pro.exe
